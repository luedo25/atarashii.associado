<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Professor</title>
    <script src="usuarios.js"></script>
   <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }

    /* CABEÇALHO / NAVBAR */
    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #1e293b;
        padding: 12px 24px;
        border-bottom: 2px solid #334155;
    }

    .logo-container {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .logo-img {
        height: 40px;
        width: auto;
        object-fit: contain;
    }

    .header-title {
        font-size: 1.2rem;
        font-weight: bold;
    }

    /* GRUPO DE BOTÕES DE AÇÃO DO HEADER */
    .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .btn-header {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        font-size: 0.9rem;
        border: none;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .btn-atualizar { background-color: #3b82f6; color: #ffffff; }
    .btn-atualizar:hover { background-color: #2563eb; }

    .btn-sair { background-color: #ef4444; color: #ffffff; }
    .btn-sair:hover { background-color: #dc2626; }

    /* NAVEGAÇÃO POR ABAS */
    .tabs-nav {
        display: flex;
        gap: 8px;
        background-color: #0f172a;
        padding: 16px 24px 0 24px;
        max-width: 800px;
        margin: 0 auto;
    }

    .nav-btn {
        flex: 1;
        background-color: #1e293b;
        color: #94a3b8;
        border: none;
        padding: 12px;
        font-size: 0.9rem;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px 8px 0 0;
        transition: all 0.2s ease;
    }

    .nav-btn:hover { color: #f8fafc; background-color: #334155; }
    .nav-btn.active { background-color: #2563eb; color: #ffffff; }

    /* CONTEÚDO DAS ABAS */
    .content-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }

    .tab-content {
        display: none;
        background: #1e293b;
        padding: 20px;
        border-radius: 0 0 12px 12px;
    }

    .tab-content.active { display: block; }

    /* ESTILOS DA CHAMADA */
    .aluno-item { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        padding: 12px 0; 
        border-bottom: 1px solid #334155; 
    }

    input[type="date"], select { 
        padding: 10px; 
        font-size: 15px; 
        margin-top: 4px;
        margin-bottom: 12px; 
        width: 100%; 
        border-radius: 6px; 
        border: 1px solid #334155;
        background-color: #0f172a;
        color: #f8fafc;
    }

    .btn-salvar { 
        width: 100%; 
        padding: 12px; 
        background: #3b82f6; 
        color: white; 
        border: none; 
        border-radius: 8px; 
        font-weight: bold; 
        cursor: pointer; 
        margin-top: 20px; 
        font-size: 1rem;
    }

    .btn-salvar:hover { background: #2563eb; }

    /* CARD DE JUSTIFICATIVAS */
    .card-justificativas {
        background: #0f172a;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #334155;
        color: #94a3b8;
        text-align: center;
    }

    /* CAIXA DE FILTROS */
    .filtro-datas-container {
        background-color: #0f172a;
        padding: 16px;
        border-radius: 8px;
        border: 1px solid #334155;
        margin-bottom: 15px;
    }

    /* GRADE DOS FILTROS (3 COLUNAS NO DESKTOP) */
    .filtro-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
    }

    .filtro-campo label {
        font-size: 0.85rem;
        color: #94a3b8;
        font-weight: bold;
        display: block;
    }

    .btn-filtrar {
        width: 100%;
        padding: 12px;
        background-color: #3b82f6;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 8px;
        font-size: 0.95rem;
    }

    .btn-filtrar:hover { background-color: #2563eb; }

    /* ESTILOS DA TABELA DE RESUMO DE FREQUÊNCIA */
    .table-responsive {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        margin-top: 15px;
        border-radius: 8px;
        border: 1px solid #334155;
    }

    .tabela-resumo {
        width: 100%;
        min-width: 550px;
        border-collapse: collapse;
        font-size: 0.95rem;
    }

    .tabela-resumo th, .tabela-resumo td {
        padding: 12px 10px;
        text-align: left;
        border-bottom: 1px solid #334155;
        white-space: nowrap;
    }

    .tabela-resumo th {
        background-color: #0f172a;
        color: #94a3b8;
        font-weight: bold;
    }

    .tabela-resumo tr:hover { background-color: #33415522; }

    .badge-porcentagem {
        padding: 4px 8px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 0.85rem;
        display: inline-block;
    }

    /* RESPONSIVIDADE PARA SMARTPHONES */
    @media (max-width: 768px) {
        .content-container {
            padding: 10px;
        }

        .tab-content {
            padding: 12px;
        }

        /* FILTROS FICAM EMPILHADOS EM 1 COLUNA NO CELULAR */
        .filtro-grid {
            grid-template-columns: 1fr !important;
            gap: 4px;
        }

        input[type="date"], select {
            margin-bottom: 8px;
        }

        .tabela-resumo th, .tabela-resumo td {
            padding: 8px 6px;
            font-size: 0.85rem;
        }

        .badge-porcentagem {
            font-size: 0.75rem;
            padding: 2px 6px;
        }

        .header-title {
            font-size: 1rem;
        }

        .btn-header {
            padding: 6px 10px;
            font-size: 0.8rem;
        }
    }
</style>
</head>
<body>

    <!-- CABEÇALHO / NAVBAR -->
    <header class="top-bar">
        <div class="logo-container">
            <img src="logo-associacao.png" alt="Logo Associação" class="logo-img">
            <span class="header-title">Área do Professor</span>
        </div>

        <div class="header-actions">
            <button onclick="location.reload()" class="btn-header btn-atualizar" title="Atualizar página">
                🔄 Atualizar
            </button>
            <a href="index.html" class="btn-header btn-sair" title="Sair do sistema">
                🚪 Sair
            </a>
        </div>
    </header>

    <!-- MENU DE ABAS -->
    <nav class="tabs-nav">
        <button class="nav-btn active" onclick="mudarAba('chamada', this)">
            📋 Chamada
        </button>
        <button class="nav-btn" onclick="mudarAba('justificativas', this)">
            📝 Justificativas
        </button>
        <button class="nav-btn" onclick="mudarAba('resumo', this)">
            📊 Resumo de Frequência
        </button>
    </nav>

    <!-- CONTEÚDO DAS ABAS -->
    <main class="content-container">

        <!-- ABA 1: CHAMADA -->
        <section id="aba-chamada" class="tab-content active">
            <h2 style="margin-bottom: 15px;">🥋 Chamada dos Alunos</h2>
            
            <label for="dataAula">Selecione a Data da Aula (Ter, Qui ou Sáb):</label>
            <input type="date" id="dataAula">

            <div id="listaAlunosContainer"></div>

            <button onclick="salvarChamada()" class="btn-salvar">💾 Salvar Chamada</button>
        </section>

   <!-- ABA 2: JUSTIFICATIVA DE FALTAS -->
        <section id="aba-justificativas" class="tab-content">
            <h2 style="margin-bottom: 15px;">📝 Pedidos de Justificativa de Faltas</h2>

            <!-- FILTRO DE ALUNO E PERÍODO DA JUSTIFICATIVA -->
            <div class="filtro-datas-container">
               <div class="filtro-grid">
                    <div class="filtro-campo">
                        <label for="filtroAlunoJustificativa">🥋 Aluno:</label>
                        <select id="filtroAlunoJustificativa" style="padding: 10px; font-size: 15px; margin-top: 4px; margin-bottom: 12px; width: 100%; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #f8fafc;">
                            <option value="todos">Todos os Alunos</option>
                        </select>
                    </div>
                    <div class="filtro-campo">
                        <label for="dataInicioJustificativa">📅 Data Inicial:</label>
                        <input type="date" id="dataInicioJustificativa" value="2026-07-01">
                    </div>
                    <div class="filtro-campo">
                        <label for="dataFimJustificativa">📅 Data Final:</label>
                        <input type="date" id="dataFimJustificativa" value="2026-12-31">
                    </div>
                </div>
                <button onclick="carregarJustificativasProfessor()" class="btn-filtrar">🔍 Filtrar Justificativas</button>
            </div>

            <div id="listaJustificativasProfessor">Carregando pedidos...</div>
        </section>

        <!-- ABA 3: RESUMO DE FREQUÊNCIA -->
        <section id="aba-resumo" class="tab-content">
            <h2 style="margin-bottom: 15px;">📊 Visão Geral de Frequência</h2>
            
     <!-- FILTRO DE PERÍODO E ALUNO -->
<div class="filtro-datas-container">
    <div class="filtro-grid">
        <div class="filtro-campo">
            <label for="filtroAluno">🥋 Aluno:</label>
            <select id="filtroAluno" style="padding: 10px; font-size: 15px; margin-top: 4px; margin-bottom: 12px; width: 100%; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #f8fafc;">
                <option value="todos">Todos os Alunos</option>
            </select>
        </div>
        <div class="filtro-campo">
            <label for="dataInicio">📅 Data Inicial:</label>
            <input type="date" id="dataInicio" value="2026-07-01">
        </div>
        <div class="filtro-campo">
            <label for="dataFim">📅 Data Final:</label>
            <input type="date" id="dataFim" value="2026-12-31">
        </div>
    </div>
    <button onclick="carregarResumoFrequencia()" class="btn-filtrar">🔍 Consultar Frequência</button>
</div>
            <div id="resumoFrequenciaContainer">Carregando relatório de frequência...</div>
        </section>

    </main>

  <script>
        const usuarioAtivo = localStorage.getItem('usuarioAtivo');
        const tipoUsuario = localStorage.getItem('tipoUsuario');

        if (localStorage.getItem('associadoAutenticado') !== 'true' || (usuarioAtivo !== 'luiz.costa' && tipoUsuario !== 'professor')) {
            alert('Acesso restrito a professores.');
            window.location.replace('index.html');
        }

        const URL_API_SERVIDOR = "https://api-associacao-mp.onrender.com";

        document.getElementById('dataAula').valueAsDate = new Date();

        function mudarAba(nomeAba, elementoBotao) {
            const abas = document.querySelectorAll('.tab-content');
            abas.forEach(aba => aba.classList.remove('active'));

            const botoes = document.querySelectorAll('.nav-btn');
            botoes.forEach(btn => btn.classList.remove('active'));

            const abaSelecionada = document.getElementById(`aba-${nomeAba}`);
            if (abaSelecionada) {
                abaSelecionada.classList.add('active');
            }

            if (elementoBotao) {
                elementoBotao.classList.add('active');
            }

            if (nomeAba === 'justificativas') {
                carregarJustificativasProfessor();
            } else if (nomeAba === 'resumo') {
                carregarResumoFrequencia();
            }
        }

        // FUNÇÃO ÚNICA: Popula a chamada e TODOS os menus de filtro de alunos
        function renderizarAlunos() {
            const container = document.getElementById('listaAlunosContainer');
            const selectAlunoResumo = document.getElementById('filtroAluno');
            const selectAlunoJustificativa = document.getElementById('filtroAlunoJustificativa');
            
            if (container) container.innerHTML = '';
            
            if (selectAlunoResumo) {
                selectAlunoResumo.innerHTML = '<option value="todos">Todos os Alunos</option>';
            }
            if (selectAlunoJustificativa) {
                selectAlunoJustificativa.innerHTML = '<option value="todos">Todos os Alunos</option>';
            }

            // Filtra o professor/administrador da lista
            const alunos = listaAlunos.filter(u => u.usuario !== 'luiz.costa');

            alunos.forEach(aluno => {
                // 1. Preenche a lista da chamada
                if (container) {
                    const div = document.createElement('div');
                    div.className = 'aluno-item';
                    div.innerHTML = `
                        <span>${aluno.nome}</span>
                        <label style="cursor: pointer;">
                            <input type="checkbox" data-usuario="${aluno.usuario}" class="chk-presente" checked> Presente
                        </label>
                    `;
                    container.appendChild(div);
                }

                // 2. Preenche o Filtro da aba Resumo
                if (selectAlunoResumo) {
                    const option = document.createElement('option');
                    option.value = aluno.usuario;
                    option.textContent = aluno.nome;
                    selectAlunoResumo.appendChild(option);
                }

                // 3. Preenche o Filtro da aba Justificativas
                if (selectAlunoJustificativa) {
                    const option = document.createElement('option');
                    option.value = aluno.usuario;
                    option.textContent = aluno.nome;
                    selectAlunoJustificativa.appendChild(option);
                }
            });
        }

        async function salvarChamada() {
            const data = document.getElementById('dataAula').value;
            if (!data) return alert("Selecione uma data.");

            const checkboxes = document.querySelectorAll('.chk-presente');
            const chamadas = Array.from(checkboxes).map(chk => ({
                usuario: chk.getAttribute('data-usuario'),
                presente: chk.checked
            }));

            try {
                const response = await fetch(`${URL_API_SERVIDOR}/api/chamada`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data, chamadas })
                });

                const result = await response.json();
                if (response.ok) {
                    alert("Chamada salva com sucesso!");
                } else {
                    alert("Erro: " + result.erro);
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Erro ao conectar ao servidor.");
            }
        }

        document.addEventListener('DOMContentLoaded', renderizarAlunos);

        function obterNomeAluno(usuario) {
            const aluno = listaAlunos.find(u => u.usuario === usuario);
            return aluno ? aluno.nome : usuario;
        }

        // CARREGAMENTO DAS JUSTIFICATIVAS COM FILTRO POR DATA E POR ALUNO
        async function carregarJustificativasProfessor() {
            const container = document.getElementById('listaJustificativasProfessor');
            container.innerHTML = "<p style='color: #94a3b8;'>Buscando justificativas no servidor...</p>";

            const dataInicio = document.getElementById('dataInicioJustificativa').value;
            const dataFim = document.getElementById('dataFimJustificativa').value;
            const usuarioSelecionado = document.getElementById('filtroAlunoJustificativa').value;

            if (!dataInicio || !dataFim) {
                alert("Por favor, selecione as datas Inicial e Final para consulta.");
                return;
            }

            try {
                const response = await fetch(`${URL_API_SERVIDOR}/api/justificativas`);
                const dados = await response.json();

                if (!Array.isArray(dados) || dados.length === 0) {
                    container.innerHTML = "<div class='card-justificativas'><p>Nenhum pedido de justificativa encontrado.</p></div>";
                    return;
                }

                // Aplica Filtro por Data e Filtro por Aluno
                const dadosFiltrados = dados.filter(item => {
                    const dataFalta = item.data_falta ? item.data_falta.substring(0, 10) : '';
                    const dentroDoPeriodo = dataFalta >= dataInicio && dataFalta <= dataFim;
                    const alunoCoincide = (usuarioSelecionado === 'todos') || (item.usuario === usuarioSelecionado);

                    return dentroDoPeriodo && alunoCoincide;
                });

                if (dadosFiltrados.length === 0) {
                    container.innerHTML = "<div class='card-justificativas'><p>Nenhum pedido de justificativa encontrado para os filtros selecionados.</p></div>";
                    return;
                }

                container.innerHTML = dadosFiltrados.map(item => {
                    const ehPendente = item.status === 'pendente';
                    let corStatus = item.status === 'aprovado' ? '#10b981' : (item.status === 'reprovado' ? '#ef4444' : '#f59e0b');

                    return `
                        <div style="background: #0f172a; padding: 16px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 12px; text-align: left;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <strong style="font-size: 16px; color: #f8fafc;">🥋 ${obterNomeAluno(item.usuario)}</strong>
                                <span style="background: ${corStatus}22; color: ${corStatus}; border: 1px solid ${corStatus}; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; text-transform: uppercase;">
                                    ${item.status}
                                </span>
                            </div>
                            <div style="font-size: 14px; color: #94a3b8; margin-bottom: 4px;"><strong>Data da Falta:</strong> ${item.data_falta.split('-').reverse().join('/')}</div>
                            <div style="font-size: 14px; color: #94a3b8; margin-bottom: 8px;"><strong>Motivo:</strong> ${item.motivo}</div>
                            <div style="font-size: 11px; color: #64748b; margin-bottom: 12px;">Enviado em: ${item.data_solicitacao}</div>

                            ${ehPendente ? `
                                <div style="display: flex; gap: 10px;">
                                    <button onclick="responderJustificativa(${item.id}, 'aprovado')" style="flex: 1; padding: 10px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">✅ Aprovar</button>
                                    <button onclick="responderJustificativa(${item.id}, 'reprovado')" style="flex: 1; padding: 10px; background: #ef4444; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">❌ Reprovar</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error("Erro ao filtrar justificativas:", err);
                container.innerHTML = "<p style='color: #ef4444;'>Erro ao carregar justificativas.</p>";
            }
        }

        async function responderJustificativa(id, status) {
            if (!confirm(`Deseja alterar o status desta justificativa para ${status.toUpperCase()}?`)) return;

            try {
                const response = await fetch(`${URL_API_SERVIDOR}/api/justificativa/resposta`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, status })
                });

                const result = await response.json();
                if (response.ok) {
                    alert(result.mensagem);
                    carregarJustificativasProfessor();
                } else {
                    alert("Erro: " + result.erro);
                }
            } catch (err) {
                alert("Erro na conexão com o servidor.");
            }
        }

        // CARREGAMENTO DE RESUMO DE FREQUÊNCIA COM FILTRO DE ALUNO E DATAS
        async function carregarResumoFrequencia() {
            const container = document.getElementById('resumoFrequenciaContainer');
            container.innerHTML = "<p style='color: #94a3b8;'>Buscando dados no servidor...</p>";

            const dataInicio = document.getElementById('dataInicio').value;
            const dataFim = document.getElementById('dataFim').value;
            const usuarioSelecionado = document.getElementById('filtroAluno').value;

            if (!dataInicio || !dataFim) {
                alert("Por favor, selecione as datas Inicial e Final para consulta.");
                return;
            }

            let alunos = listaAlunos.filter(u => u.usuario !== 'luiz.costa');
            if (usuarioSelecionado !== 'todos') {
                alunos = alunos.filter(u => u.usuario === usuarioSelecionado);
            }

            let linhasHTML = '';

            try {
                let mapaJustificativas = {};
                try {
                    const respJust = await fetch(`${URL_API_SERVIDOR}/api/justificativas`);
                    if (respJust.ok) {
                        const listaJustificativas = await respJust.json();
                        if (Array.isArray(listaJustificativas)) {
                            listaJustificativas.forEach(item => {
                                const dataFalta = item.data_falta ? item.data_falta.substring(0, 10) : '';
                                if (item.status === 'aprovado' && dataFalta >= dataInicio && dataFalta <= dataFim) {
                                    mapaJustificativas[item.usuario] = (mapaJustificativas[item.usuario] || 0) + 1;
                                }
                            });
                        }
                    }
                } catch (eJust) {
                    console.warn("Aviso ao carregar justificativas:", eJust);
                }

                for (const aluno of alunos) {
                    let presencas = 0;
                    let faltas = 0;

                    try {
                        const response = await fetch(
                            `${URL_API_SERVIDOR}/api/frequencia/${aluno.usuario}?dataInicio=${dataInicio}&dataFim=${dataFim}`
                        );
                        
                        if (response.ok) {
                            const dados = await response.json();
                            presencas = dados.presencas || 0;
                            faltas = dados.faltas || 0;
                        }
                    } catch (e) {
                        console.warn(`Erro ao carregar dados do aluno ${aluno.usuario}:`, e);
                    }

                    const justificativasAprovadas = mapaJustificativas[aluno.usuario] || 0;

                    const faltasAjustadas = Math.max(0, faltas - justificativasAprovadas);
                    const presencasEfetivas = presencas + justificativasAprovadas;
                    const totalAulas = presencasEfetivas + faltasAjustadas;

                    const pctPresenca = totalAulas > 0 ? ((presencasEfetivas / totalAulas) * 100).toFixed(0) : 0;

                    let corBadge = '#10b981';
                    if (pctPresenca < 75) corBadge = '#ef4444';
                    else if (pctPresenca < 85) corBadge = '#f59e0b';

                    linhasHTML += `
                        <tr>
                            <td style="font-weight: bold; color: #f8fafc;">${aluno.nome}</td>
                            <td style="color: #10b981; font-weight: bold;">${presencas}</td>
                            <td style="color: #ef4444; font-weight: bold;">${faltasAjustadas} <span style="font-size: 11px; color: #94a3b8;">(${faltas} Total de Faltas)</span></td>
                            <td style="color: #3b82f6; font-weight: bold;">${justificativasAprovadas}</td>
                            <td>
                                <span class="badge-porcentagem" style="background: ${corBadge}22; color: ${corBadge}; border: 1px solid ${corBadge};">
                                    ${pctPresenca}% Presença
                                </span>
                            </td>
                        </tr>
                    `;
                }

                if (linhasHTML === '') {
                    container.innerHTML = "<p style='color: #94a3b8;'>Nenhum registro encontrado para o filtro selecionado.</p>";
                    return;
                }

                container.innerHTML = `
                    <div class="table-responsive">
