<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Painel do Aluno">
    <link rel="apple-touch-icon" href="./atarashii-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Área do Associado</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .logo-associacao { width: 360px; height: auto; margin: 0 auto 40px auto; display: block; }
        .login-container { background-color: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
        .login-container h2 { text-align: center; margin-bottom: 24px; color: #333; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #666; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; transition: border-color 0.3s; }
        .input-group input:focus { border-color: #007bff; outline: none; }
        .btn-login { width: 100%; padding: 12px; background-color: #007bff; border: none; border-radius: 4px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-bottom: 10px; }
        .btn-login:hover { background-color: #0056b3; }
        .btn-link { width: 100%; padding: 10px; background: none; border: none; color: #666; cursor: pointer; text-decoration: underline; font-size: 14px; }
        .error-message { color: #dc3545; font-size: 14px; margin-top: 10px; text-align: center; display: none; }
        .btn-guia-estudo { position: fixed; top: 20px; left: 20px; display: inline-flex; align-items: center; padding: 10px 16px; background-color: #2c3e50; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: bold; border-radius: 6px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); z-index: 99999; }
        
        /* Modal Alterar Senha */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 100000; }
        .modal-content { background: #fff; padding: 30px; border-radius: 8px; width: 90%; max-width: 400px; }
        
        @media (max-width: 600px) {
            body { justify-content: flex-start; padding-top: 180px; }
            .btn-guia-estudo { top: 15px; left: 15px; padding: 8px 12px; font-size: 13px; }
            .logo-associacao { position: absolute; left: 50%; transform: translateX(-50%); top: 65px; width: 160px; }
            .login-container { padding: 25px 20px; }
        }
    </style>
</head>
<body>
    <a href="https://adrianomiguell-collab.github.io/App-Karate/prototype/" class="btn-guia-estudo">Guia de Estudo</a>
    <img src="ASSOCIAÇÃO-ATARASHII.gif" alt="Logo Associação Atarashii" class="logo-associacao">
        
    <div class="login-container">
        <h2>Área do Associado</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" required placeholder="Digite seu usuário">
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="Digite sua senha">
            </div>
            <button type="submit" class="btn-login">Entrar</button>
            <button type="button" class="btn-link" onclick="document.getElementById('modalSenha').style.display='flex'">Alterar Minha Senha</button>
            <div id="errorMessage" class="error-message"></div>
        </form>
    </div>        

    <!-- Modal Alterar Senha -->
    <div id="modalSenha" class="modal">
        <div class="modal-content">
            <h3 style="text-align: center; margin-bottom: 20px;">Alterar Senha</h3>
            <form id="formAlterarSenha">
                <div class="input-group">
                    <label>Usuário</label>
                    <input type="text" id="altUsuario" required>
                </div>
                <div class="input-group">
                    <label>Senha Atual</label>
                    <input type="password" id="altSenhaAtual" required>
                </div>
                <div class="input-group">
                    <label>Nova Senha</label>
                    <input type="password" id="altSenhaNova" required>
                </div>
                <button type="submit" class="btn-login" style="background-color: #28a745;">Confirmar Alteração</button>
                <button type="button" class="btn-link" onclick="document.getElementById('modalSenha').style.display='none'">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const URL_API_SERVIDOR = "https://api-associacao-mp.onrender.com";

        // Login API
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault(); 
            const usuarioInput = document.getElementById('username').value.trim();
            const senhaInput = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            try {
                const response = await fetch(`${URL_API_SERVIDOR}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuarioInput, senha: senhaInput })
                });
                
                const data = await response.json();

                if (data.sucesso) {
                    localStorage.setItem('associadoAutenticado', 'true');
                    localStorage.setItem('nomeAlunoLogado', data.usuario.nome);
                    localStorage.setItem('usuarioAtivo', data.usuario.usuario);
                    localStorage.setItem('tipoUsuario', data.usuario.tipo);

                    if (data.usuario.tipo === 'professor') {
                        window.location.href = 'professor.html';
                    } else {
                        window.location.href = 'area-associado.html';
                    }
                } else {
                    errorMessage.textContent = data.erro;
                    errorMessage.style.display = 'block';
                }
            } catch (err) {
                errorMessage.textContent = 'Erro de conexão com o servidor.';
                errorMessage.style.display = 'block';
            }
        });

        // Alterar Senha API
        document.getElementById('formAlterarSenha').addEventListener('submit', async function(e) {
            e.preventDefault();
            const usuario = document.getElementById('altUsuario').value.trim();
            const senhaAntiga = document.getElementById('altSenhaAtual').value;
            const novaSenha = document.getElementById('altSenhaNova').value;

            try {
                const response = await fetch(`${URL_API_SERVIDOR}/api/alterar-senha`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senhaAntiga, novaSenha })
                });
                const data = await response.json();
                
                if (data.sucesso) {
                    alert('Senha alterada com sucesso! Faça login com a nova senha.');
                    document.getElementById('modalSenha').style.display = 'none';
                    document.getElementById('formAlterarSenha').reset();
                } else {
                    alert('Erro: ' + data.erro);
                }
            } catch (err) {
                alert('Erro ao comunicar com o servidor.');
            }
        });
    </script>
</body>
</html>
