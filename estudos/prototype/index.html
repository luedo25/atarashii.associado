<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atarashii App - MVP</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="../assets/brand/atarashii-logo.png" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <img class="brand-mark" src="../assets/brand/atarashii-logo.png" alt="Logo Atarashii Karate-do Shotokan" />
        <div class="brand-copy">
          <p class="eyebrow">Guia de estudo</p>
          <h1>Atarashii App</h1>
        </div>
        <button class="icon-button" id="progressButton" type="button" title="Abrir progresso" aria-label="Abrir progresso">◎</button>
      </header>

      <main id="app" class="content" aria-live="polite"></main>

      <nav class="tabbar" aria-label="Navegacao principal">
        <button class="tab is-active" data-route="home" type="button">Início</button>
        <button class="tab" data-route="pilares" type="button">Pilares</button>
        <button class="tab" data-route="progresso" type="button">Progresso</button>
      </nav>
    </div>

    <script src="progress-service.js"></script>
    <script src="learning-engine.js"></script>
    <script src="assessment-engine.js"></script>
    <script src="challenge-engine.js"></script>
    <script src="search-service.js"></script>
    <script src="gamification.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js")
            .then((reg) => console.log("[PWA] Service Worker registrado!", reg.scope))
            .catch((err) => console.warn("[PWA] Falha ao registrar Service Worker", err));
        });
      }
    </script>
  </body>
</html>
