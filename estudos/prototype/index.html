<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atarashii App - MVP</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="../assets/brand/atarashii-logo.png" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <img class="brand-mark" src="../assets/brand/atarashii-logo.png" alt="Logo Atarashii Karate-do Shotokan" />
        <div class="brand-copy">
          <p class="eyebrow">Guia de estudo</p>
          <h1 id="studentName">Validando sessão...</h1>
        </div>
        <div class="topbar-actions">
          <button class="topbar-action" id="refreshButton" type="button">↻ Atualizar</button>
          <a class="topbar-action" href="../../area-associado.html">← Área do Associado</a>
        </div>
      </header>

      <main id="app" class="content" aria-live="polite"><p class="empty">Validando sua sessão...</p></main>

      <nav class="tabbar" aria-label="Navegação principal">
        <button class="tab is-active" data-route="home" type="button"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9M9 20v-7h6v7"/></svg><span>Início</span></button>
        <button class="tab" data-route="pilares" type="button"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9m5 11V4m6 16v-8m5 8V6"/><path d="M2 20h20M3 6l6-3 6 6 6-4"/></svg><span>Pilares</span></button>
        <button class="tab" data-route="estudos" type="button"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 5.5V22M8 7h8M8 11h8M8 15h5"/></svg><span>Estudos</span></button>
        <button class="tab" data-route="progresso" type="button"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 6-7"/><path d="M16 6h4v4"/></svg><span>Progresso</span></button>
        <button class="tab" data-route="atarashii" type="button"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h18M5 8V5h14v3M7 8v13m10-13v13M3 21h18M9 12h6"/><path d="M4 3h16"/></svg><span>A Atarashii</span></button>
      </nav>
    </div>

    <script src="../../api.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          const studyScope = new URL("./", location.href).pathname;
          registrations
            .filter((registration) => new URL(registration.scope).pathname === studyScope)
            .forEach((registration) => registration.unregister());
        }).catch(() => {});
      }
    </script>
    <script src="progress-service.js"></script>
    <script src="certificate-pdf.js"></script>
    <script src="curriculum-engine.js"></script>
    <script src="learning-engine.js"></script>
    <script src="assessment-engine.js"></script>
    <script src="challenge-engine.js"></script>
    <script src="search-service.js"></script>
    <script src="gamification.js"></script>
    <script src="app.js"></script>
  </body>
</html>
